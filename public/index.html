<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover is what actually makes `useSafeAreaInsets()` (react-
      native-safe-area-context's web shim reads CSS env(safe-area-inset-*))
      return real non-zero values here instead of silently 0 — found live:
      every Sheet's home-indicator padding fix (see components/Sheet.tsx)
      quietly did nothing specifically when the site is opened from an iOS
      "Add to Home Screen" bookmark (standalone display mode, see apple-
      mobile-web-app-capable below), because without this the page never
      extends into the safe-area regions in the first place, so there's
      nothing for env() to report. A normal Safari tab never showed the bug
      at all — Safari's own chrome already sits in that space regardless.
      black-translucent (below) specifically depends on this too: a
      translucent status bar only makes sense once the page knows to draw
      content behind it rather than under it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!--
      web.output is "single" (SPA) in app.json, which means Expo Router's
      app/+html.tsx mechanism is NOT used — this file (copied verbatim from
      node_modules/expo/node_modules/@expo/cli/static/template/index.html,
      with the icon links/meta below added) is the actual template in that
      mode. Without an apple-touch-icon link, "Add to Home Screen" on iOS
      Safari has no app icon to use and falls back to a screenshot of
      whatever's on screen, which is what looked like a missing logo.
    -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Epify" />
    <meta name="theme-color" content="#0d1524" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* 100% alone resolves against the *layout* viewport, which on iOS
           Safari (including standalone/home-screen mode) can report taller
           than what's actually drawn on screen — a long-documented iOS quirk
           with 100%/100vh in general, not specific to viewport-fit=cover.
           100dvh ("dynamic viewport height") is the unit iOS 15.4+ added
           specifically to report the *real* visible height instead; without
           it here, html/body/#root below could end up sized taller than the
           true screen, leaving whatever's flex-laid-out inside (the tab bar
           included) sitting above a dead strip of the body's own background
           at the bottom rather than flush with the real bottom edge. Kept
           as a second declaration (not a replacement) so a browser that
           doesn't understand 100dvh still gets 100% rather than nothing.
         */
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* overflow:hidden alone still lets iOS rubber-band the whole page,
         which is what let the tab bar be dragged around by hand. Pinning
         html/body in place and disabling overscroll makes the page itself
         immovable — every ScrollView inside still scrolls normally. */
      html,
      body {
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /* iOS standalone only — see the script right below. */
      html.app-height,
      html.app-height body,
      html.app-height #root {
        height: var(--app-height);
      }
    </style>

    <script>
      // iOS standalone PWA quirk, confirmed live: right after a cold launch
      // from the Home Screen icon, window.innerHeight (and therefore 100dvh)
      // can report ~43pt LESS than the real screen until the first
      // scroll/drag makes WebKit recompute it — showing up as a blank strip
      // below the tab bar that only went away once the user dragged the
      // page. An earlier workaround tried to nudge WebKit into recomputing
      // (scrollTo tricks) but wasn't reliable. Standalone mode has no
      // browser chrome at all, so a full-screen window is exactly the
      // screen's own size — use that directly instead of trusting the
      // viewport measurement. iOS's screen.width/height never swap on
      // rotation, hence min/max. Only applied when the window really spans
      // the full screen width (not an iPad Stage Manager / split window,
      // where the screen size would be wrong), otherwise falls back to
      // 100dvh as before. Runs in <head> so the very first paint is right.
      if (window.navigator.standalone) {
        (function () {
          var root = document.documentElement;
          function applyAppHeight() {
            var sw = screen.width;
            var sh = screen.height;
            var landscape = window.innerWidth > window.innerHeight;
            var fullWidth = landscape ? Math.max(sw, sh) : Math.min(sw, sh);
            var fullHeight = landscape ? Math.min(sw, sh) : Math.max(sw, sh);
            if (Math.abs(window.innerWidth - fullWidth) <= 1) {
              root.style.setProperty("--app-height", fullHeight + "px");
              root.classList.add("app-height");
            } else {
              root.classList.remove("app-height");
            }
          }
          applyAppHeight();
          window.addEventListener("resize", applyAppHeight);
          window.addEventListener("orientationchange", applyAppHeight);
          window.addEventListener("pageshow", applyAppHeight);
        })();
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!--
      Registers the app-shell service worker (public/sw.js) — speeds up
      reopening the site from an iOS Home Screen icon after it's been fully
      quit, by serving the JS/CSS bundle from a local cache instead of
      re-downloading it every cold start. Plain script here (not inside the
      React bundle) so registration doesn't depend on that bundle having
      already loaded — it only needs to succeed once for every later visit
      to benefit. No-ops harmlessly wherever service workers aren't
      supported.
    -->
    <script>
      // Never on localhost — that's always a local dev server (expo start
      // --web), never the real deployed site, and this worker's cache-first
      // rule for same-origin requests doesn't know Metro's own dev bundle
      // URL (/node_modules/expo-router/entry.bundle?...) is special: unlike
      // a production build's content-hashed filenames, that URL stays
      // identical across every single edit, so the first version this
      // worker ever saw of it would otherwise get served forever — every
      // later code change silently invisible in that browser profile, no
      // matter how many times the dev server restarts, until the one
      // *registering* this worker stops happening (here) and sw.js's own
      // self-destruct (see its own comment) clears what's already stuck.
      const isLocalDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (!isLocalDev && "serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>

  </body>
</html>
